<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Egress-blocking Content-Security-Policy, shipped as a <meta> so it applies in
      EVERY deployment — including the self-hosted release bundle and the dev server,
      where Firebase's response headers are absent. Keep in sync with the (stronger)
      header in firebase.json: that copy additionally sets frame-ancestors, which is
      ignored when delivered via <meta>.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:11434 http://127.0.0.1:11434; worker-src 'self' blob:; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Zero-knowledge, browser-only PII sanitizer. Your data never leaves your device."
    />
    <title>🔒 PII Data Sanitizer</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
