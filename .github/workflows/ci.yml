name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build name packs
        run: npm run build:db
      - name: Benchmark gate (proven suite + baseline F1)
        run: npm run bench
      - name: Build app
        run: npm run build
