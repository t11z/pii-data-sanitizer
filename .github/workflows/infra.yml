name: Infrastructure (Terraform)

# Infrastructure-as-Code for the Firebase Hosting site (see infra/terraform).
# Inert until enabled: set repo variable IAC_ENABLED=true plus GCP_PROJECT_ID,
# FIREBASE_SITE_ID, TF_STATE_BUCKET and the GCP_SA_KEY secret (see infra/README.md).

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra.yml'
  pull_request:
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: infra/terraform

jobs:
  terraform:
    runs-on: ubuntu-latest
    if: ${{ vars.IAC_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=pii-sanitizer"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate
        run: terraform validate

      - name: Plan
        run: |
          terraform plan -input=false \
            -var "project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var "site_id=${{ vars.FIREBASE_SITE_ID }}"

      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          terraform apply -auto-approve -input=false \
            -var "project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var "site_id=${{ vars.FIREBASE_SITE_ID }}"
