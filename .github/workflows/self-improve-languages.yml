name: Self-Improve - Language Expansion

# Expansion layer of the multi-workflow self-improvement loop.
# It does nothing here except invoke the /self-improve-languages slash command
# (defined in .claude/commands/self-improve-languages.md) so the behaviour and
# guardrails live in one place and stay in sync with local usage.
#
# Requires the CLAUDE_CODE_OAUTH_TOKEN repo secret (generate with
# `claude setup-token`). Opens PRs only — never merges.

on:
  schedule:
    - cron: '0 6 * * 1' # weekly, Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      focus:
        description: 'Optional language/region to focus on'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  id-token: write # required by anthropics/claude-code-action@v1 (OIDC token)

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT (when configured) so branches pushed by the loop trigger CI on
          # the resulting PR — GitHub suppresses workflow runs for pushes/PRs
          # made with the default GITHUB_TOKEN. Falls back to the default token
          # when the SELF_IMPROVE_PAT secret is absent.
          token: ${{ secrets.SELF_IMPROVE_PAT || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run /self-improve-languages
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PAT-or-default so the PR opened by gh inside the action triggers CI.
          github_token: ${{ secrets.SELF_IMPROVE_PAT || github.token }}
          # Pin to current Opus rather than the action default, so all
          # self-improve loops run the same reviewed model.
          claude_args: '--model claude-opus-4-8'
          prompt: '/self-improve-languages ${{ github.event.inputs.focus }} — research strategically and prefer extending the ingestion pipeline; open a PR only if it adds at least 1000 net-new names.'
