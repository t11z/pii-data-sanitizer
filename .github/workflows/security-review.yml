name: Security Review

# AI-powered security review, modelled on anthropics/claude-code-security-review
# but driven through anthropics/claude-code-action@v1 so it authenticates with a
# Claude Code OAuth token (CLAUDE_CODE_OAUTH_TOKEN) and bills against a Pro/Max
# subscription instead of an Anthropic API key. The official action only accepts
# an API key (set as ANTHROPIC_API_KEY, which takes precedence over the OAuth
# token), so it cannot bill a subscription without a fork.
#
# Behaviour and guardrails live in the /security-review slash command
# (.claude/commands/security-review.md) so CI and local runs stay identical.
#
# Reuses the existing CLAUDE_CODE_OAUTH_TOKEN repo secret (generate with
# `claude setup-token`) — no extra secret is required. Comments on PRs / opens
# issues only — it never edits code or merges.

on:
  pull_request:
  schedule:
    - cron: '0 7 * * 1' # weekly, Monday 07:00 UTC — full-repo scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Reviews the diff of an open pull request and comments findings on the PR.
  pr-review:
    # Fork PRs can't read the OAuth secret; skip cleanly instead of failing.
    # (docs/self-improve.md already documents that fork PRs aren't auto-reviewed.)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write # required by anthropics/claude-code-action@v1 (OIDC token)
    concurrency:
      group: security-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the diff against the base branch is available
      - name: Ensure base ref is available for the diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        # fetch-depth: 0 normally brings all branches, but make the guarantee
        # explicit so the /security-review diff never depends on checkout
        # internals. The fetch lives here because the command's allowed-tools
        # deliberately exclude `git fetch`.
        run: git fetch origin "$BASE_REF"
      - name: Run /security-review on the PR diff
        uses: anthropics/claude-code-action@v1
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Security judgment calls warrant the strongest model; pinned so
          # results are comparable run-to-run instead of drifting with the
          # action default.
          claude_args: '--model claude-opus-4-8'
          prompt: '/security-review'
          # Self-improvement PRs are opened by claude[bot]; allow that bot so the
          # action's anti-loop actor guard doesn't fail the check on exactly the
          # automated PRs that most need a security review.
          allowed_bots: 'claude'

  # Weekly (and on-demand) full-repository scan that opens a labeled issue on findings.
  full-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write # required by anthropics/claude-code-action@v1 (OIDC token)
    concurrency:
      group: security-review-full
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the --full scan can inspect recent commits
      - name: Run /security-review --full on the whole repo
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Same pin as the pr-review job — see the comment there.
          claude_args: '--model claude-opus-4-8'
          prompt: '/security-review --full'
