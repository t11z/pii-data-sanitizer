name: Self-Improve - Accuracy Refinement

# Refinement layer of the multi-workflow self-improvement loop.
# It only invokes the /self-improve-refine slash command (defined in
# .claude/commands/self-improve-refine.md); all behaviour and guardrails live
# there so CI and local runs stay identical.
#
# Requires the CLAUDE_CODE_OAUTH_TOKEN repo secret (generate with
# `claude setup-token`). Opens PRs only — never merges.

on:
  schedule:
    - cron: '0 6 * * 4' # weekly, Thursday 06:00 UTC
  workflow_dispatch:
    inputs:
      focus:
        description: 'Optional PII type or failing case to focus on'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  id-token: write # required by anthropics/claude-code-action@v1 (OIDC token)

# One run at a time so a slow run and the next schedule never stack duplicate PRs.
concurrency:
  group: self-improve-refine
  cancel-in-progress: false

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PAT (when configured) so branches pushed by the loop trigger CI on
          # the resulting PR — GitHub suppresses workflow runs for pushes/PRs
          # made with the default GITHUB_TOKEN. Falls back to the default token
          # when the SELF_IMPROVE_PAT secret is absent.
          token: ${{ secrets.SELF_IMPROVE_PAT || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run /self-improve-refine
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # PAT-or-default so the PR opened by gh inside the action triggers CI.
          github_token: ${{ secrets.SELF_IMPROVE_PAT || github.token }}
          # Pin to current Opus rather than the action default, so all
          # self-improve loops run the same reviewed model.
          claude_args: '--model claude-opus-4-8'
          prompt: '/self-improve-refine ${{ github.event.inputs.focus }}'
